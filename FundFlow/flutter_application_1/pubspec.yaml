name: flutter_application_1
description: FundFlow - Aplikasi Pengelolaan Keuangan Mahasiswa
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#0F172A"
  image: assets/images/logo_fundflow.png
  image_dark: assets/images/logo_fundflow.png
  android_12:
    image: assets/images/logo_fundflow.png
    color: "#F8FAFC"
    color_dark: "#0F172A"
  android: true
  ios: true
  web: false
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/